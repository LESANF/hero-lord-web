<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>영웅서기 솔티아의 바람: 리마스터</title>
<meta name="description" content="브라우저 버전">
<meta property="og:type" content="website">
<meta property="og:title" content="영웅서기 솔티아의 바람: 리마스터">
<meta property="og:description" content="브라우저 버전">
<meta property="og:url" content="https://lesanf.github.io/hero-lord-web/">
<meta property="og:image" content="https://lesanf.github.io/hero-lord-web/og.jpg">

<!-- Cloudflare Web Analytics (JS snippet mode, no cookies): visits, referrers, countries, vitals -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "2f29d6c2a87043008cde29afc3cd84d4"}'></script>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #0b1326; color: #3a2f2a; overflow: hidden; touch-action: none; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
#canvas { display: block; image-rendering: pixelated; }
#canvas:focus { outline: none; }

/* loading screen */
#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 14px;
  padding: 0 24px 9vh; box-sizing: border-box; color: #fff; text-align: center;
  background: #0b1326 url(img/loading.jpg) center / cover no-repeat; transition: opacity .6s ease; }
#status::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,14,30,0) 45%, rgba(8,14,30,.78) 100%); pointer-events: none; }
#status > * { position: relative; }
#status.done { opacity: 0; pointer-events: none; }
#logo { width: min(58vw, 520px); height: auto; margin-bottom: 6px; image-rendering: auto; filter: drop-shadow(0 6px 22px rgba(0,0,0,.55)); }
#bar { width: min(72vw, 460px); height: 6px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
#fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ffd56b, #fff4c2 60%, #ffffff); box-shadow: 0 0 14px rgba(255,214,110,.85); transition: width .15s linear; position: relative; }
#fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: sheen 1.6s linear infinite; }
@keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
#status small { font-size: 13px; letter-spacing: .06em; opacity: .8; min-height: 1.2em; }
#status pre { margin: 0; white-space: pre-wrap; color: #ffb3b3; font-size: 13px; }

/* in-app browser notice (Threads/Instagram/KakaoTalk...): their sheet gestures eat drags */
#inapp { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: none; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px 14px; background: rgba(20, 16, 14, .92); color: #fff;
  font: 500 13px/1.35 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
#inapp.show { display: flex; }
/* in-app scroll guard: the page scrolls a little, the game stays fixed on screen */
html.inapp { height: 100%; }
html.inapp, html.inapp body { overflow: visible; }
html.inapp #canvas, html.inapp #status { position: fixed !important; top: 0 !important; left: 0 !important; }
html.inapp #status { right: 0; bottom: 0; }
#inapp span { flex: 1; }
#inapp a { flex: none; padding: 8px 12px; border-radius: 8px; background: #ffd56b; color: #2a2118; font-weight: 700; text-decoration: none; }
#inapp button { flex: none; background: none; border: 0; color: rgba(255,255,255,.7); font-size: 20px; line-height: 1; padding: 4px 6px; }

/* build id, title screens only, faint */
#ver { position: fixed; left: 10px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 5; display: none; font: 500 11px/1 ui-monospace, Menlo, monospace; color: rgba(255,255,255,.45); text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none; }
#ver.show { display: block; }

/* art switch: lives on the page, above the canvas, top centre where the game draws nothing */
#artbar { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); display: none; padding: 3px; border-radius: 999px;
  background: rgba(30, 26, 24, .72); backdrop-filter: blur(6px); box-shadow: 0 2px 8px rgba(0,0,0,.25); touch-action: manipulation; }
#artbar.show { display: flex; }
#artbar.ingame { display: none; }
#artbar button { font: 600 13px/1 system-ui, sans-serif; color: rgba(255,255,255,.75); background: none; border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
#artbar button.active { background: #f7f3ea; color: #3a2f2a; }
#artbar button:focus { outline: none; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="artbar" aria-label="그래픽">
  <button data-art="original">원작 그래픽</button>
  <button data-art="remaster">리마스터</button>
</div>
<div id="inapp" role="alert">
  <span>이동이 안 되면 브라우저에서 열어 주세요.</span>
  <a id="inapp-open" href="#">브라우저로 열기</a>
  <button id="inapp-close" aria-label="닫기">×</button>
</div>
<div id="ver"></div>
<input id="save-file" type="file" accept=".json,application/json" hidden>
<div id="status">
  <img id="logo" src="img/logo.webp" alt="영웅서기 솔티아의 바람: 리마스터">
  <div id="bar"><div id="fill"></div></div>
  <small id="detail">불러오는 중</small>
  <pre id="notice"></pre>
</div>
<script src="godot.js"></script>
<script>
// Filled by tools/build_web.py. The PCK ships as 64 MB parts (static hosts tend to
// cap single files at 100 MB); the parts are fetched in parallel straight into one
// buffer and handed to the engine.
const PACK = 'hero-lord.pck';
const PARTS = __PARTS__;
const WASM_SIZE = __WASM_SIZE__;
const BUILD = '__BUILD__';            // first 8 hex of the PCK's sha256, also in the part names
console.log('hero-lord-web build', BUILD);

// In-app browsers (Threads, Instagram, Facebook, KakaoTalk, Naver, Line...) show the page in a
// sheet. When the page is scrolled to the very top, the sheet takes a downward drag as "close"
// and the game only gets touchcancel, so the joystick never moves. Two layers:
//  1. Keep the document scrolled a little (canvas fixed on top) so the sheet sees content that
//     can scroll and leaves the drag to the page; the game already preventDefaults touchmove.
//  2. A banner offering the real browser: Chrome if installed (iOS: googlechromes://), else the
//     system browser (Android intent without a package, KakaoTalk openExternal), else copy link.
(() => {
  const ua = navigator.userAgent;
  if (!/Barcelona|Instagram|FBAN|FBAV|KAKAOTALK|NAVER\(inapp|Line\/|DaumApps|everytimeApp/i.test(ua)) return;
  const ios = /iPhone|iPad|iPod/i.test(ua);
  const android = /Android/i.test(ua);
  const url = location.href;
  const bare = url.replace(/^https?:\/\//, '');

  // 1. scroll guard
  const PAD = 120;
  document.documentElement.classList.add('inapp');
  document.body.style.height = `calc(100% + ${PAD}px)`;
  const keep = () => { if (Math.abs(window.scrollY - PAD) > 1) window.scrollTo(0, PAD); };
  window.addEventListener('scroll', keep, { passive: true });
  window.addEventListener('resize', keep);
  requestAnimationFrame(keep);

  // 2. banner
  const bar = document.getElementById('inapp');
  const open = document.getElementById('inapp-open');
  const say = (t) => { bar.querySelector('span').textContent = t; };
  const copy = () => {
    const done = () => say('링크를 복사했어요. 크롬이나 사파리 주소창에 붙여넣어 주세요. (오른쪽 위 ⋯ → 외부 브라우저로 열기도 돼요)');
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, done); else done();
  };
  if (/KAKAOTALK/i.test(ua)) {
    open.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  } else if (android) {
    // no package: Android hands it to the user's default browser (Chrome, Samsung Internet...)
    open.href = 'intent://' + bare + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
  } else if (ios) {
    open.href = (url.startsWith('https') ? 'googlechromes://' : 'googlechrome://') + bare;
    open.addEventListener('click', () => {
      // If Chrome is not installed nothing happens and the page stays visible: fall back.
      const t0 = Date.now();
      setTimeout(() => { if (document.visibilityState === 'visible' && Date.now() - t0 < 2500) copy(); }, 1500);
    });
  } else {
    open.href = url;
  }
  open.textContent = '크롬으로 열기';
  document.getElementById('inapp-close').onclick = () => bar.classList.remove('show');
  bar.classList.add('show');
})();

// Phones report devicePixelRatio 2.6-3.5, so Godot would render ~9x the pixels of a
// 1x canvas every frame. It is pixel art: render at most 1.5x and let CSS upscale crisp.
if (matchMedia('(pointer: coarse)').matches && window.devicePixelRatio > 1.5) {
  Object.defineProperty(window, 'devicePixelRatio', { get: () => 1.5 });
}

const engine = new Engine({
  executable: 'godot',
  canvasResizePolicy: 2,      // adaptive: canvas follows the window
  focusCanvas: true,
  experimentalVK: false,
  serviceWorker: false,
  fileSizes: { 'godot.wasm': WASM_SIZE },
});
const canvas = document.getElementById('canvas');
const status = document.getElementById('status');
const fill = document.getElementById('fill');
const detail = document.getElementById('detail');
const notice = document.getElementById('notice');
const artbar = document.getElementById('artbar');
const artButtons = [...artbar.querySelectorAll('button')];

function fail(err) {
  console.error(err);
  document.getElementById('bar').remove();
  notice.textContent = err instanceof Error ? err.message : String(err);
}

async function fetchParts(parts) {
  const total = parts.reduce((sum, [, size]) => sum + size, 0);
  const all = new Uint8Array(total);
  let done = 0;
  let base = 0;
  await Promise.all(parts.map(([name, size]) => {
    const offset = base;
    base += size;
    return fetch(name).then(async (res) => {
      if (res.status === 404) {
        // A newer build replaced the parts while this index.html was still cached (Pages
        // caches for 10 min). Reload once with a cache-busting query to get the new page.
        let bounced = false;
        try { bounced = sessionStorage.getItem('bounced') === BUILD; sessionStorage.setItem('bounced', BUILD); } catch (e) { /* ignore */ }
        if (!bounced) { location.replace(`${location.pathname}?v=${Date.now()}${location.hash}`); return new Promise(() => {}); }
      }
      if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
      const reader = res.body.getReader();
      let got = 0;
      for (;;) {
        const { value, done: end } = await reader.read();
        if (end) break;
        all.set(value, offset + got);
        got += value.length;
        done += value.length;
        fill.style.width = `${(done / total) * 100}%`;
        detail.textContent = `${(done / 1048576).toFixed(0)} / ${(total / 1048576).toFixed(0)} MB · ${Math.floor((done / total) * 100)}%`;
      }
      if (got !== size) throw new Error(`${name}: got ${got} of ${size} bytes`);
    });
  }));
  return all.buffer;
}

// Art choice: remembered per browser (first visit: 원작), ?art=original|remaster overrides.
// It reaches the game twice: as a user arg at start (web_shim.gd writes new_art into
// user://options.json before the game reads it) and live through window.heroLordSetArt,
// which the shim exposes; the shim fires 'herolord-art' whenever the game's state changes.
function remembered() {
  const q = new URLSearchParams(location.search).get('art');
  if (q === 'original' || q === 'remaster') return q;
  try { return localStorage.getItem('art') || 'original'; } catch (e) { return 'original'; }
}
function showArt(art) {
  artButtons.forEach((b) => b.classList.toggle('active', b.dataset.art === art));
}
const ver = document.getElementById('ver');
ver.textContent = 'web ' + BUILD;
window.addEventListener('herolord-title', (e) => { artbar.classList.toggle('ingame', !e.detail); ver.classList.toggle('show', e.detail); });
window.addEventListener('herolord-art', (e) => { showArt(e.detail); try { localStorage.setItem('art', e.detail); } catch (err) { /* ignore */ } });
artButtons.forEach((b) => {
  b.onclick = () => { if (window.heroLordSetArt) window.heroLordSetArt(b.dataset.art); canvas.focus(); };
});

// Save import: the game's 환경설정 row (added by the shim) opens this picker; the shim's
// heroLordImportSaves writes the files and leaves the count on window.heroLordImportResult.
const saveFile = document.getElementById('save-file');
saveFile.onchange = async () => {
  const file = saveFile.files[0];
  if (!file || !window.heroLordImportSaves) return;
  window.heroLordImportSaves(await file.text());
  if (window.heroLordImportResult > 0) setTimeout(() => location.reload(), 1200);   // let IDBFS sync, then 이어하기 lists them
  else alert('세이브 파일 형식이 아닙니다.');
  saveFile.value = '';
};

const missing = Engine.getMissingFeatures({ threads: false });
if (missing.length) {
  fail('This browser is missing:\n' + missing.join('\n'));
} else {
  const art = remembered();
  showArt(art);
  Promise.all([engine.init('godot'), fetchParts(PARTS)])
    .then(([, pack]) => {
      engine.preloadFile(pack, PACK);
      detail.textContent = '시작하는 중';
      return engine.start({ args: ['--main-pack', PACK, '--', `art=${art}`] });
    })
    .then(() => {
      status.classList.add('done'); setTimeout(() => status.remove(), 700); artbar.classList.add('show');
      setTimeout(() => document.getElementById('inapp').classList.remove('show'), 10000);   // don't sit on the HUD's 메뉴 key
    }, fail);
}
</script>
</body>
</html>
