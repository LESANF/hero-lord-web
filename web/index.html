<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>Hero Lord Remaster</title>
<!-- Cloudflare Web Analytics (JS snippet mode, no cookies): visits, referrers, countries, vitals -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "2f29d6c2a87043008cde29afc3cd84d4"}'></script>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #f7f3ea; color: #3a2f2a; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; background: #f7f3ea; padding: 16px; box-sizing: border-box; overflow: auto; }
#status h1 { font-size: 20px; font-weight: 600; margin: 0; }
#choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.card { width: min(44vw, 360px); border: 2px solid #d9d0c0; border-radius: 10px; background: #fff; padding: 0 0 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px 8px 0 0; background: #e8e2d6; }
.card b { display: block; margin: 10px 12px 2px; font-size: 16px; }
.card small { display: block; margin: 0 12px; opacity: .65; }
.card.selected { border-color: #9b3943; }
.card:disabled { opacity: .5; cursor: default; }
#status progress { width: min(60vw, 420px); }
#status small.detail { opacity: .6; }
#status pre { margin: 0 16px; white-space: pre-wrap; color: #9b3943; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="status">
  <h1>영웅서기 · 솔티아의 바람 리마스터</h1>
  <div id="choices">
    <button class="card" data-art="original"><img src="img/original.jpg" alt=""><b>원작 그래픽</b><small>2005년 원작 픽셀 그대로</small></button>
    <button class="card" data-art="remaster"><img src="img/remaster.jpg" alt=""><b>리마스터 그래픽</b><small>새로 그린 고해상도 픽셀</small></button>
  </div>
  <small class="detail">그래픽은 게임 안 환경설정에서 언제든 바꿀 수 있습니다. 고르면 바로 시작합니다.</small>
  <progress id="progress"></progress>
  <small class="detail" id="detail"></small>
  <pre id="notice"></pre>
</div>
<script src="godot.js"></script>
<script>
// Filled by tools/build_web.py. The PCK ships as 64 MB parts (static hosts tend to
// cap single files at 100 MB); the parts are fetched in parallel straight into one
// buffer and handed to the engine.
const PACK = 'hero-lord.pck';
const PARTS = __PARTS__;
const WASM_SIZE = __WASM_SIZE__;

const engine = new Engine({
  executable: 'godot',
  canvasResizePolicy: 2,      // adaptive: canvas follows the window
  focusCanvas: true,
  experimentalVK: false,
  serviceWorker: false,
  fileSizes: { 'godot.wasm': WASM_SIZE },
});
const status = document.getElementById('status');
const progress = document.getElementById('progress');
const detail = document.getElementById('detail');
const notice = document.getElementById('notice');
const cards = [...document.querySelectorAll('.card')];

function fail(err) {
  console.error(err);
  progress.remove();
  notice.textContent = err instanceof Error ? err.message : String(err);
}

async function fetchParts(parts) {
  const total = parts.reduce((sum, [, size]) => sum + size, 0);
  const all = new Uint8Array(total);
  let done = 0;
  let base = 0;
  await Promise.all(parts.map(([name, size]) => {
    const offset = base;
    base += size;
    return fetch(name).then(async (res) => {
      if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
      const reader = res.body.getReader();
      let got = 0;
      for (;;) {
        const { value, done: end } = await reader.read();
        if (end) break;
        all.set(value, offset + got);
        got += value.length;
        done += value.length;
        progress.value = done;
        progress.max = total;
        detail.textContent = `${(done / 1048576).toFixed(0)} / ${(total / 1048576).toFixed(0)} MB`;
      }
      if (got !== size) throw new Error(`${name}: got ${got} of ${size} bytes`);
    });
  }));
  return all.buffer;
}

// The choice goes to the game as a user arg (after `--`); web/web_shim.gd writes it
// into user://options.json (new_art) before the game reads its options.
function start(art) {
  try { localStorage.setItem('art', art); } catch (e) { /* private mode etc. */ }
  cards.forEach((c) => { c.disabled = true; c.classList.toggle('selected', c.dataset.art === art); });
  ready
    .then(([, pack]) => {
      engine.preloadFile(pack, PACK);
      detail.textContent = '';
      return engine.start({ args: ['--main-pack', PACK, '--', `art=${art}`] });
    })
    .then(() => status.remove(), fail);
}

const missing = Engine.getMissingFeatures({ threads: false });
let ready;
if (missing.length) {
  fail('This browser is missing:\n' + missing.join('\n'));
} else {
  ready = Promise.all([engine.init('godot'), fetchParts(PARTS)]);   // download while the player decides
  ready.catch(fail);
  let last = 'original';
  try { last = localStorage.getItem('art') || last; } catch (e) { /* ignore */ }
  cards.forEach((c) => { c.classList.toggle('selected', c.dataset.art === last); c.onclick = () => start(c.dataset.art); });
  const wanted = new URLSearchParams(location.search).get('art');   // ?art=original|remaster skips the question
  if (wanted === 'original' || wanted === 'remaster') start(wanted);
}
</script>
</body>
</html>
